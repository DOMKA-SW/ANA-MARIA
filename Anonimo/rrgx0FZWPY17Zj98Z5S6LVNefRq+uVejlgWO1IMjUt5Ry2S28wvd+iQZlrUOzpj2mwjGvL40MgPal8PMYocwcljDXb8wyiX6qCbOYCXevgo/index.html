<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporizador</title>
<style>
:root{color-scheme:dark;--bg:#000;--text:#f2f2f2;--muted:#8a8a90;--line:#26262b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:200;display:flex;align-items:center;justify-content:center;text-align:center}
main{padding:24px;width:100%;max-width:720px}
.clock{display:flex;justify-content:center;gap:clamp(14px,5vw,44px);margin-bottom:56px}
.num{font-size:clamp(2.4rem,11vw,4.6rem);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lbl{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:12px}
button{font:inherit;font-size:.78rem;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:14px 36px;cursor:not-allowed;opacity:.5;transition:all .5s}
button.ready{cursor:pointer;opacity:1;color:var(--text);border-color:var(--text)}
button.ready:hover{background:var(--text);color:var(--bg)}
#reveal,#gate{display:none}
#reveal.show{display:block;animation:fade 2.4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#reveal .to{font-size:clamp(1rem,3.5vw,1.3rem);color:var(--muted);letter-spacing:.15em;margin:0 0 20px;font-weight:300}
#reveal img{display:block;width:100%;max-width:560px;height:auto;margin:36px auto 0}
#reveal .msg{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:200;line-height:1.25;margin:0}
.hide{display:none!important}
#secret{position:fixed;right:0;bottom:0;width:56px;height:56px;opacity:0;cursor:default;-webkit-tap-highlight-color:transparent}
#gate.show{display:flex;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:5}
#gate input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-weight:300;text-align:center;padding:10px;width:240px;outline:none}
#gate input:focus{border-color:var(--muted)}
#gate .err{color:var(--muted);font-size:.75rem;min-height:1em}
#gate .x{font-size:.7rem;letter-spacing:.2em;border:0;padding:6px;opacity:.6;cursor:pointer}
#exit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font-size:.65rem;padding:8px 12px;border:0;opacity:.35;cursor:pointer}
/* Minijuegos */
#games{margin-top:56px}
#games .lead{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
#games .tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#games button.g{cursor:pointer;opacity:1;padding:10px 18px;font-size:.65rem;letter-spacing:.2em}
#games button.g.on{color:var(--text);border-color:var(--text)}
#stage{display:none;margin-top:24px}
#stage canvas{border:1px solid var(--line);max-width:100%;touch-action:none;display:block;margin:0 auto}
#stage .info{margin-top:14px;font-size:.75rem;letter-spacing:.15em;color:var(--muted);min-height:1.2em;cursor:pointer}
#stage .grid{display:grid;gap:8px;justify-content:center;margin:0 auto;grid-template-columns:repeat(4,64px)}
#stage .cell{width:100%;aspect-ratio:1;font-size:1.6rem;padding:0;letter-spacing:0;opacity:1;cursor:pointer;color:var(--text);border:1px solid var(--line);background:transparent}
#stage .cell.up{border-color:var(--text)}
</style>
</head>
<body>
<main>
  <section id="wait">
    <div class="clock">
      <div><div class="num" id="d">00</div><div class="lbl">Días</div></div>
      <div><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
      <div><div class="num" id="m">00</div><div class="lbl">Min</div></div>
      <div><div class="num" id="s">00</div><div class="lbl">Seg</div></div>
    </div>
    <button id="btn" disabled>Revelar</button>
    <div id="games">
      <p class="lead">Mientras esperas</p>
      <div class="tabs">
        <button class="g" data-g="snake">Snake</button>
        <button class="g" data-g="memoria">Memoria</button>
        <button class="g" data-g="flappy">Flappy</button>
      </div>
      <div id="stage"></div>
    </div>
  </section>
  <section id="reveal">
    <p class="to">Ana María</p>
    <p class="msg" id="msg"></p>
    <img id="pic" alt="" class="hide">
  </section>
</main>
<button id="exit" class="hide">Salir</button>
<div id="secret"></div>
<div id="gate">
  <input id="pw" type="password" placeholder="Clave" autocomplete="off">
  <div class="err" id="err"></div>
  <button class="x" id="cancel">Cancelar</button>
</div>
<script>
(function(){
  var TARGET = Date.parse('2026-10-29T12:00:00-05:00'); // 12:00 pm hora de Bogotá
  var MSG_B64 = 'QmllbnZlbmlkYSBhIHR1IG51ZXZhIGV4cGVyaWVuY2lhLi4u';
  /* >>> IMAGEN: borra la línea de abajo y pega en su lugar tu línea original  var IMG='data:image/jpeg;base64,...';  <<< */
  var IMG='';
  var PW_HASH = '1557f5ded061dcf72396e8912ebf3e97bf852b514cd89a1cff15e7c2b9b83562'; // SHA-256 de la clave de vista previa

  var KEY='cr_maxseen', stored=0;
  try{ stored=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
  var t0=Math.max(Date.now(),stored), p0=performance.now();
  function now(){
    var n=t0+(performance.now()-p0);
    try{ localStorage.setItem(KEY,String(Math.floor(n))); }catch(e){}
    return n;
  }
  var $=function(id){return document.getElementById(id);};
  var btn=$('btn'), ready=false, preview=false;
  function pad(n){return String(n).padStart(2,'0');}

  function tick(){
    var left=TARGET-now();
    if(left<=0){
      ['d','h','m','s'].forEach(function(k){$(k).textContent='00';});
      if(!ready){ready=true;btn.disabled=false;btn.classList.add('ready');}
      return;
    }
    var s=Math.floor(left/1000);
    $('d').textContent=pad(Math.floor(s/86400));
    $('h').textContent=pad(Math.floor(s%86400/3600));
    $('m').textContent=pad(Math.floor(s%3600/60));
    $('s').textContent=pad(s%60);
  }
  tick(); setInterval(tick,250);

  function showMessage(){
    var bin=atob(MSG_B64), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    $('msg').textContent=new TextDecoder().decode(bytes);
    if(IMG){ $('pic').src=IMG; $('pic').classList.remove('hide'); }
    $('wait').classList.add('hide');
    $('reveal').classList.remove('show'); void $('reveal').offsetWidth;
    $('reveal').classList.add('show');
  }
  btn.addEventListener('click',function(){ if(now()>=TARGET) showMessage(); });

  // Vista previa secreta: 5 toques rápidos en la esquina inferior derecha (o Ctrl+Shift+K) y clave
  var taps=0,tt;
  $('secret').addEventListener('click',function(){
    taps++; clearTimeout(tt); tt=setTimeout(function(){taps=0;},1500);
    if(taps>=5){taps=0;openGate();}
  });
  addEventListener('keydown',function(e){
    if(e.ctrlKey&&e.shiftKey&&(e.key==='K'||e.key==='k')){e.preventDefault();openGate();}
    if(e.key==='Escape') closeGate();
  });
  function openGate(){ if(preview) return; $('gate').classList.add('show'); $('pw').value=''; $('err').textContent=''; setTimeout(function(){$('pw').focus();},50); }
  function closeGate(){ $('gate').classList.remove('show'); }
  $('cancel').addEventListener('click',closeGate);
  async function sha(s){
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }
  $('pw').addEventListener('keydown',async function(e){
    if(e.key!=='Enter') return;
    var ok=false; try{ ok=(await sha($('pw').value))===PW_HASH; }catch(x){}
    if(ok){ preview=true; closeGate(); showMessage(); $('exit').classList.remove('hide'); }
    else { $('err').textContent='Clave incorrecta'; $('pw').value=''; }
  });
  $('exit').addEventListener('click',function(){
    preview=false; $('msg').textContent=''; $('pic').removeAttribute('src'); $('pic').classList.add('hide'); $('reveal').classList.remove('show');
    $('wait').classList.remove('hide'); $('exit').classList.add('hide');
    if(ready) showMessage();
  });
})();
</script>
<script>
/* ===== Minijuegos ===== */
(function(){
  var stage=document.getElementById('stage'),tabs=document.querySelectorAll('#games .g'),timer=null,keyH=null;
  function rnd(n){return Math.floor(Math.random()*n);}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function stop(){clearInterval(timer);timer=null;if(keyH){removeEventListener('keydown',keyH);keyH=null;}}
  function open(n){
    stop();stage.innerHTML='';stage.style.display='block';
    tabs.forEach(function(b){b.classList.toggle('on',b.dataset.g===n);});
    ({snake:snake,memoria:memoria,flappy:flappy})[n]();
  }
  tabs.forEach(function(b){b.addEventListener('click',function(){open(b.dataset.g);});});

  /* ---------- SNAKE ---------- */
  function snake(){
    var N=15,C=20,c=el('canvas'),info=el('div','info'),x,s,d,nd,f,sc,over;
    c.width=c.height=N*C;stage.append(c,info);x=c.getContext('2d');
    function food(){do{f={x:rnd(N),y:rnd(N)};}while(s.some(function(p){return p.x===f.x&&p.y===f.y;}));}
    function reset(){s=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];d=nd={x:1,y:0};sc=0;over=false;food();info.textContent='Puntos: 0';draw();}
    function draw(){
      x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);
      x.fillStyle='#f2f2f2';s.forEach(function(p){x.fillRect(p.x*C+1,p.y*C+1,C-2,C-2);});
      x.fillStyle='#e0566e';x.fillRect(f.x*C+3,f.y*C+3,C-6,C-6);
    }
    function step(){
      if(over)return;d=nd;
      var h={x:s[0].x+d.x,y:s[0].y+d.y};
      if(h.x<0||h.y<0||h.x>=N||h.y>=N||s.some(function(p){return p.x===h.x&&p.y===h.y;})){
        over=true;info.textContent='Fin · '+sc+' puntos · toca para reiniciar';return;
      }
      s.unshift(h);
      if(h.x===f.x&&h.y===f.y){sc++;info.textContent='Puntos: '+sc;food();}else s.pop();
      draw();
    }
    function turn(dx,dy){if(dx===-d.x&&dy===-d.y)return;nd={x:dx,y:dy};}
    keyH=function(e){
      if(e.target.tagName==='INPUT')return;
      var k=e.key.length===1?e.key.toLowerCase():e.key;
      var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[k];
      if(m){e.preventDefault();turn(m[0],m[1]);}
    };
    addEventListener('keydown',keyH);
    var sx,sy;
    c.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
    c.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
    c.addEventListener('touchend',function(e){
      var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
      if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
    });
    function again(){if(over)reset();}
    c.addEventListener('click',again);info.addEventListener('click',again);
    reset();timer=setInterval(step,120);
  }

  /* ---------- MEMORIA ---------- */
  function memoria(){
    var em=['💖','🌹','🍓','🌙','🦋','🎀'],cards=em.concat(em).sort(function(){return Math.random()-.5;}),
        g=el('div','grid'),info=el('div','info','Encuentra las parejas'),sel=[],lock=false,moves=0,found=0;
    cards.forEach(function(e){
      var b=el('button','cell');
      b.addEventListener('click',function(){
        if(lock||b.classList.contains('up'))return;
        b.classList.add('up');b.textContent=e;sel.push(b);
        if(sel.length<2)return;
        moves++;
        if(sel[0].textContent===sel[1].textContent){
          found++;sel=[];
          info.textContent=found===6?'Listo en '+moves+' movimientos · toca para reiniciar':'Movimientos: '+moves;
        }else{
          lock=true;
          setTimeout(function(){sel.forEach(function(q){q.classList.remove('up');q.textContent='';});sel=[];lock=false;},700);
          info.textContent='Movimientos: '+moves;
        }
      });
      g.appendChild(b);
    });
    info.addEventListener('click',function(){open('memoria');});
    stage.append(g,info);
  }

  /* ---------- FLAPPY ---------- */
  function flappy(){
    var W=300,H=380,GAP=120,PW=46,BX=70,R=11,c=el('canvas'),info=el('div','info'),x,b,pipes,sc,best=0,over,overAt,started,fr;
    c.width=W;c.height=H;stage.append(c,info);x=c.getContext('2d');
    function reset(){b={y:H/2,v:0};pipes=[];sc=0;over=false;started=false;fr=0;info.textContent='Toca o presiona espacio para volar';draw();}
    function flap(){
      if(over){if(Date.now()-overAt>500)reset();return;}
      started=true;b.v=-5.4;
    }
    function die(){over=true;overAt=Date.now();if(sc>best)best=sc;info.textContent='Fin · '+sc+' puntos · récord '+best+' · toca para reiniciar';}
    function step(){
      if(over||!started){draw();return;}
      b.v+=.34;b.y+=b.v;fr++;
      if(fr%85===1)pipes.push({x:W,gap:40+rnd(H-GAP-80),s:false});
      pipes.forEach(function(p){
        p.x-=2.2;
        if(!p.s&&p.x+PW<BX){p.s=true;sc++;info.textContent='Puntos: '+sc;}
        if(BX+R>p.x&&BX-R<p.x+PW&&(b.y-R<p.gap||b.y+R>p.gap+GAP))die();
      });
      pipes=pipes.filter(function(p){return p.x>-PW;});
      if(b.y<R){b.y=R;b.v=0;}
      if(b.y>H-R)die();
      draw();
    }
    function draw(){
      x.fillStyle='#000';x.fillRect(0,0,W,H);
      x.fillStyle='#f2f2f2';
      pipes.forEach(function(p){x.fillRect(p.x,0,PW,p.gap);x.fillRect(p.x,p.gap+GAP,PW,H-p.gap-GAP);});
      x.fillStyle='#e0566e';x.beginPath();x.arc(BX,b.y,R,0,6.2832);x.fill();
      x.fillStyle='#000';x.beginPath();x.arc(BX+4,b.y-3,2,0,6.2832);x.fill();
      x.fillStyle='#8a8a90';x.font='200 28px system-ui,sans-serif';x.textAlign='center';x.fillText(sc,W/2,44);
    }
    keyH=function(e){
      if(e.target.tagName==='INPUT')return;
      if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap();}
    };
    addEventListener('keydown',keyH);
    c.addEventListener('pointerdown',function(e){e.preventDefault();flap();});
    info.addEventListener('click',flap);
    reset();timer=setInterval(step,1000/60);
  }
})();
</script>
</body>
</html>
